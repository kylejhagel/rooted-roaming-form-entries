name: Release ZIP
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid SemVer tag"; exit 1; }
      - name: Verify release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag is not on main"; exit 1; }
      - name: Syntax check
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Create ZIP
        run: bash scripts/package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-installation-zip
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --verify-tag
